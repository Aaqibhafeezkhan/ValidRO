name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the published files
        run: npm pack --dry-run
      - name: Smoke test the ESM and CommonJS builds
        run: |
          node --input-type=module -e "import { validateCnp } from './dist/index.js'; if (!validateCnp('3000101221147').valid) process.exit(1); console.log('ESM ok')"
          node -e "const { validateCnp } = require('./dist/index.cjs'); if (!validateCnp('3000101221147').valid) process.exit(1); console.log('CJS ok')"
          test -f dist/index.d.ts && test -f dist/index.d.cts && echo "type declarations ok"
